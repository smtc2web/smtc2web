[package]
authors = ["smtc2web Contributors"]
description = "An software can let OBS show playing media."
edition = "2024"
name = "smtc2web"
version = "0.6.8"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
crate-type = ["staticlib", "cdylib", "rlib"]
name = "smtc2web_lib"

[build-dependencies]
tauri-build = {version = "2", features = [] }

[dependencies]
base64 = "0.22"
dirs = "5.0"
mime_guess = "2.0"
open = "5.0"
notify = "6"
rust-embed = "8.0"
serde = {version = "1", features = ["derive"] }
serde_json = "1"
tauri = {version = "2", features = ["tray-icon", "image-png"] }

tokio = {version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "0.8"
# 0.4 使用 hyper 1.x / h2 0.4，修复 RUSTSEC-2026-0258（h2 无界空 DATA 帧）。
warp = { version = "0.4", features = ["server"] }
chrono = "0.4"
named-lock = "0.4"

# 9.x 修复 zip 的三条路径处理公告；仅启用解压所需的 deflate。
zip = { version = "9.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# 本项目的更新包是 NSIS/.exe、deb、rpm，不使用 zip 更新包，
# 因此关闭默认的 zip 特性，避免引入受影响的 zip 4.x 与不需要的 tar 解压代码。
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
url = "2"
ttf-parser = "0.25"
tokio-stream = { version = "0.1", features = ["sync"] }

[target.'cfg(target_os = "windows")'.dependencies.windows]
features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage",
  "Storage_Streams",
  "Management_Deployment",
  "ApplicationModel",
  "System",
  "Win32_System_WinRT",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_System_Console",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_System_Registry",
]
version = "0.58"

[target.'cfg(target_os = "linux")'.dependencies]
mpris = "2.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "core"
harness = false
