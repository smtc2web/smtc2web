name: 功能建议
description: 提出新功能或改进现有体验的想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出新想法！提交前请先搜索 [现有 Issue](https://github.com/smtc2web/smtc2web/issues)，避免重复。本模板可用中文或英文填写。

        > 使用问题或开放讨论请前往 [Zulip 社区](https://smtc2web.zulipchat.com)。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有找到相同建议
          required: true

  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      options:
        - 媒体源（Windows SMTC / Linux MPRIS2）
        - HTTP 服务与 OBS 浏览器源
        - 主题系统（安装、切换、更新）
        - 设置界面、托盘与窗口行为
        - 安装包与自动更新
        - 界面语言与翻译
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述当前遇到的不便或使用场景，而不是直接给出实现方式
      placeholder: "例如：我在 OBS 中同时使用多个音源时，很难……"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 可附示意图、参考项目链接或配置片段

  - type: checkboxes
    id: contribution
    attributes:
      label: 参与实现
      options:
        - label: 我愿意为此提交 Pull Request
