name: "Snapshot"

on:
  workflow_dispatch:
  push:
    tags:
      - v*.*.*-snapshot*

permissions:
  contents: write

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
          - platform: "windows-latest"
            target: "aarch64-pc-windows-msvc"
          - platform: "ubuntu-latest"
            target: "x86_64-unknown-linux-gnu"
          # - platform: "ubuntu-latest"
          #   target: "aarch64-unknown-linux-gnu"
          # - platform: "ubuntu-latest"
          #   target: "riscv64gc-unknown-linux-gnu"
          # - platform: "ubuntu-latest"
          #   target: "loongarch64-unknown-linux-gnu"

    runs-on: ${{ matrix.platform }}
    outputs:
      build-target: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: install dependencies (ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo dpkg --add-architecture arm64
            sudo apt update
            sudo apt install gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            sudo apt install libwebkit2gtk-4.1-dev:arm64 \
              libssl-dev:arm64 \
              libayatana-appindicator3-dev:arm64 \
              librsvg2-dev:arm64 \
              libxdo-dev:arm64
          fi

      - name: setup volta
        uses: volta-cli/action@v5.0.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install target
        run: rustup target add ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: pnpm install

      - name: build frontend
        run: pnpm build

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: 1
        with:
          tagName: v__VERSION__
          releaseName: "v__VERSION__"
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  finalize:
    needs: [publish-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate and upload merged latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          gh release download "$TAG" --pattern "*.sig" -D ./sigs 2>/dev/null || true

          node -e "
          const fs = require('fs');
          const tag = '$TAG';
          const version = '$VERSION';
          const repo = '${{ github.repository }}';

          const manifest = {
            version,
            notes: '',
            pub_date: new Date().toISOString(),
            platforms: {}
          };

          const entries = [
            { installer: 'smtc2web_' + version + '_x64-setup.exe', keys: ['windows-x86_64', 'windows-x86_64-nsis'] },
            { installer: 'smtc2web_' + version + '_arm64-setup.exe', keys: ['windows-aarch64', 'windows-aarch64-nsis'] },
            { installer: 'smtc2web_' + version + '_amd64.deb', keys: ['linux-x86_64', 'linux-x86_64-deb'] },
            { installer: 'smtc2web_' + version + '_x86_64.rpm', keys: ['linux-x86_64-rpm'] },
          ];

          for (const entry of entries) {
            const sigPath = './sigs/' + entry.installer + '.sig';
            if (!fs.existsSync(sigPath)) continue;
            const signature = fs.readFileSync(sigPath, 'utf-8').trim();
            const url = 'https://github.com/' + repo + '/releases/download/' + tag + '/' + entry.installer;
            for (const key of entry.keys) {
              manifest.platforms[key] = { signature, url };
            }
          }

          fs.writeFileSync('latest.json', JSON.stringify(manifest, null, 2));
          "

          gh release upload "$TAG" latest.json --clobber
