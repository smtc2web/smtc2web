name: "Check"

on:
  push:
    branches: ["master"]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "**/*.png"
      - "**/*.svg"
      - "**/*.ico"
      - "**/*.icns"
      - "**/*.out"
      - "**/*.jsonc"
      - "LICENSE"
      - ".gitignore"
      - ".agents/**"
      - ".vscode/**"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - "notes/**"
  pull_request:
    branches: ["master"]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "**/*.png"
      - "**/*.svg"
      - "**/*.ico"
      - "**/*.icns"
      - "**/*.out"
      - "**/*.jsonc"
      - "LICENSE"
      - ".gitignore"
      - ".agents/**"
      - ".vscode/**"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - "notes/**"

permissions:
  contents: read

jobs:
  check:
    name: cargo check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: install dependencies (ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: setup mise
        uses: jdx/mise-action@v5

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: add target
        run: rustup target add ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: "${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.target }}"

      - name: install frontend dependencies
        run: pnpm install

      - name: build frontend
        run: pnpm build

      - name: cargo check (${{ matrix.target }})
        run: cargo check --target ${{ matrix.target }}
        working-directory: ./src-tauri

  clippy:
    name: clippy
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: install dependencies (ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: setup mise
        uses: jdx/mise-action@v5

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: add target
        run: rustup target add ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: "${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.target }}"

      - name: install frontend dependencies
        run: pnpm install

      - name: build frontend
        run: pnpm build

      - name: clippy (${{ matrix.target }})
        run: cargo clippy --target ${{ matrix.target }} -- -D warnings
        working-directory: ./src-tauri

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: setup mise
        uses: jdx/mise-action@v5

      - name: install frontend dependencies
        run: pnpm install

      - name: typecheck
        run: pnpm typecheck
        working-directory: ./src-tauri/frontend

  licenses:
    name: licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: setup mise
        uses: jdx/mise-action@v5

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3

      - name: install frontend dependencies
        run: pnpm install

      # 提前暴露新依赖的未接受许可证，避免发版打包时才失败；
      # 清单文件已入库（build.rs 校验 bundle resources 路径），此处验证未过期
      - name: generate third-party license list
        run: pnpm licenses:generate

      - name: verify license list is up to date
        run: |
          git diff --exit-code --stat -- src-tauri/third-party-licenses || {
            echo "::error::third-party-licenses/ 与当前依赖不一致，请本地运行 pnpm licenses:generate 并提交更新后的清单"
            exit 1
          }
