name: "Check"

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  check:
    name: cargo check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: install dependencies (ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: setup volta
        uses: volta-cli/action@v5.0.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: add target
        run: rustup target add ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: "${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.target }}"

      - name: install frontend dependencies
        run: pnpm install

      - name: build frontend
        run: pnpm build

      - name: cargo check (${{ matrix.target }})
        run: cargo check --target ${{ matrix.target }}
        working-directory: ./src-tauri

  clippy:
    name: clippy
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: install dependencies (ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: setup volta
        uses: volta-cli/action@v5.0.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: add target
        run: rustup target add ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: "${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.target }}"

      - name: install frontend dependencies
        run: pnpm install

      - name: build frontend
        run: pnpm build

      - name: clippy (${{ matrix.target }})
        run: cargo clippy --target ${{ matrix.target }} -- -D warnings
        working-directory: ./src-tauri

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: setup volta
        uses: volta-cli/action@v5.0.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6

      - name: install frontend dependencies
        run: pnpm install

      - name: typecheck
        run: pnpm typecheck
        working-directory: ./src-tauri/frontend
